<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewHub Premium Logo Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
        }

        .container {
            text-align: center;
        }

        .logo-canvas {
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle at center, #1a1d2e 0%, #0f1117 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 0 120px rgba(255, 107, 53, 0.25),
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 0 150px rgba(255, 107, 53, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            border: 4px solid rgba(255, 107, 53, 0.3);
            overflow: hidden;
        }

        .logo-canvas::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, 
                rgba(255, 107, 53, 0.6) 0%, 
                rgba(255, 107, 53, 0.2) 25%,
                rgba(255, 107, 53, 0.1) 50%,
                rgba(255, 107, 53, 0.2) 75%,
                rgba(255, 107, 53, 0.6) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-canvas::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255, 107, 53, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .icon-container {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .icon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(255, 107, 53, 0.08));
            border-radius: 50%;
            box-shadow: 
                0 0 80px rgba(255, 107, 53, 0.3),
                inset 0 0 60px rgba(255, 107, 53, 0.15);
        }

        .briefcase-icon {
            position: absolute;
            width: 180px;
            height: 180px;
            fill: #1a1d2e;
            filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.5));
            z-index: 1;
        }

        .chat-icon {
            position: absolute;
            width: 110px;
            height: 110px;
            fill: #ff6b35;
            filter: drop-shadow(0 6px 40px rgba(255, 107, 53, 0.8));
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .brand-text {
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .brand-name {
            font-size: 92px;
            font-weight: 900;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 6px 30px rgba(255, 255, 255, 0.15);
            line-height: 1;
            filter: drop-shadow(0 4px 20px rgba(255, 255, 255, 0.1));
        }

        .brand-subtitle {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 8px;
            color: rgba(255, 107, 53, 0.9);
            text-transform: uppercase;
            text-shadow: 0 3px 15px rgba(255, 107, 53, 0.4);
        }

        .download-btn {
            margin-top: 40px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #ff6b35, #ff8555);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.4);
        }

        .info {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-canvas" id="logoCanvas">
            <div class="icon-container">
                <div class="icon-bg"></div>
                
                <!-- Briefcase Icon (Dark) -->
                <svg class="briefcase-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="7" width="18" height="13" rx="2" ry="2"/>
                    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <path d="M3 13h18" stroke="#0f1117" stroke-width="1.5" fill="none"/>
                </svg>

                <!-- Chat Icon (Orange) -->
                <svg class="chat-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
            </div>

            <div class="brand-text">
                <div class="brand-name">InterviewHub</div>
                <div class="brand-subtitle">SHARE YOUR EXPERIENCE</div>
            </div>
        </div>

        <button class="download-btn" onclick="downloadLogo()">Download Logo (PNG)</button>
        <div class="info">Right-click on the logo and "Save Image As..." or use the download button</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadLogo() {
            const canvas = document.getElementById('logoCanvas');
            
            try {
                const screenshot = await html2canvas(canvas, {
                    backgroundColor: null,
                    scale: 3,
                    width: 1000,
                    height: 1000,
                    logging: false
                });

                const link = document.createElement('a');
                link.download = 'interviewhub-logo-premium.png';
                link.href = screenshot.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error('Download failed:', error);
                alert('Please right-click on the logo and select "Save Image As..."');
            }
        }
    </script>
</body>
</html>
